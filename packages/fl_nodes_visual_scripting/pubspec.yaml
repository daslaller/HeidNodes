name: fl_nodes_visual_scripting
description: A generic, headless trigger/condition/action automation/workflow layer built on fl_nodes_core — run a saved graph without a widget tree, plus friendlier node-authoring helpers.
version: 0.1.0
maintainer: daslaller (fork), William Karol Di Cioccio (upstream fl_nodes_core)
license: MIT

resolution: workspace

homepage: https://github.com/daslaller/heidnodes
repository: https://github.com/daslaller/heidnodes
issue_tracker: https://github.com/daslaller/heidnodes/issues

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - fl-nodes
  - visual-scripting
  - framework

funding:
  - buymeacoffee.com/Wilielmus

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  fl_nodes_core: 0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
  test_coverage_badge: ^0.3.2
